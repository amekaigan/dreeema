<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ゆめクエスト</title>
<style>
:root{
  --ink:#2C2C2A; --sub:#5F5E5A; --mute:#888780; --line:#D3D1C7;
  --card:#FFFFFF; --bg:#F7F5EF; --accent:#185FA5; --done:#3B6D11;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom)}

header{padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;font-weight:600;margin:0;flex:1}
.lv{font-size:13px;color:var(--sub)}

#stage{position:relative;width:100%;height:46vh;overflow:hidden;background:#0B1A2A;
  border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);touch-action:none}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#world img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

.hud{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;color:var(--sub)}
.hud .sp{flex:1}
.hud button{padding:5px 11px;font-size:12px;border:.5px solid var(--line);background:var(--card);
  border-radius:8px;color:var(--sub);font-family:inherit}

main{padding:4px 14px 40px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:14px;font-weight:600;margin:0 0 8px}
.note{font-size:12px;color:var(--mute);margin:6px 2px;line-height:1.7}
.rowline{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rowline .nm{font-size:12px;color:var(--sub);width:52px;flex:none}
.bar{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.rowline .vl{font-size:11px;color:var(--mute);width:50px;text-align:right;flex:none}
.quest{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--line)}
.quest:first-of-type{border-top:none}
.quest .tg{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.quest.done .tg{background:var(--done);border-color:var(--done)}
.quest .tx{flex:1;font-size:14px}
.quest.done .tx{color:var(--mute);text-decoration:line-through}
.quest .xp{font-size:12px;color:var(--mute);flex:none}
.quest.explore .xp{color:var(--accent);font-weight:600}

#picker{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--accent);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  z-index:30;max-height:54vh;overflow:auto}
#picker.on{display:block}
#pickOut{width:100%;height:120px;font-size:11px;font-family:ui-monospace,Menlo,monospace;
  border:.5px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
#picker .row{display:flex;gap:6px;margin-top:8px}
#picker button{flex:1;padding:8px;font-size:12px;border:.5px solid var(--line);background:var(--bg);
  border-radius:8px;color:var(--sub);font-family:inherit}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(20,20,20,.88);
  color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;z-index:40;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <h1 id="mapTitle">ゆめクエスト</h1>
  <span class="lv" id="totalLv">Lv.0</span>
</header>

<div id="stage">
  <div id="world">
    <img id="mapImg" alt="">
    <svg id="overlay" preserveAspectRatio="none"></svg>
  </div>
</div>

<div class="hud">
  <span class="sp" id="progress"></span>
  <button id="zoomOut">－</button>
  <button id="zoomIn">＋</button>
  <button id="reset">もどす</button>
</div>

<main>
  <div class="card">
    <h2 id="spotTitle">いまいるところ</h2>
    <p class="note" id="spotNote"></p>
  </div>

  <div class="card">
    <h2>ステータス</h2>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h2>きょうのクエスト</h2>
    <div id="quests"></div>
    <p class="note">日課をこなすと ポイントが たまり、つぎの スポットへ すすみます。</p>
  </div>
</main>

<div id="picker">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <strong style="font-size:13px;flex:1">座標ピッカー</strong>
    <span style="font-size:11px;color:var(--mute)" id="pickCount">0点</span>
  </div>
  <textarea id="pickOut" readonly></textarea>
  <div class="row">
    <button id="pickUndo">1つ消す</button>
    <button id="pickClear">全部消す</button>
    <button id="pickCopy">コピー</button>
    <button id="pickClose">とじる</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   ゆめクエスト v0.2  —  1枚絵マップビューア + 座標ピッカー
   repo: amekaigan/dreeema
   単一HTML / ビルド不要 / 保存は Store 経由（のちに Firestore へ）
   ============================================================ */

/* ---------- 保存レイヤー ---------- */
var Store = (function () {
  var mem = {}, ok = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) {}
  return {
    get: function (k, d) {
      try { var v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      var s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; }
    }
  };
})();

/* ---------- マップ定義 ----------
   x / y は画像に対する 0〜1 の相対座標。
   下の値は仮置き。座標ピッカーで取り直して差し替えること。
------------------------------------------------------------ */
var MAPS = [
  {
    id: 'g2-04', grade: 2, month: 4,
    title: '砂の港町', sub: '旅のはじまり',
    img: 'maps/g2-04-sand-port.webp',
    spots: [
      { id: 's1',  name: 'はじまりの桟橋', x: 0.200, y: 0.720 },
      { id: 's2',  name: 'ヤシの森',       x: 0.310, y: 0.630 },
      { id: 's3',  name: '緑のオアシス',   x: 0.220, y: 0.500 },
      { id: 's4',  name: '王都の門',       x: 0.380, y: 0.420 },
      { id: 's5',  name: '中央市場',       x: 0.460, y: 0.360 },
      { id: 's6',  name: '風の谷',         x: 0.200, y: 0.260 },
      { id: 's7',  name: '砂の霊峰',       x: 0.360, y: 0.130 },
      { id: 's8',  name: '大砂海',         x: 0.580, y: 0.190 },
      { id: 's9',  name: '赤岩の丘',       x: 0.720, y: 0.550 },
      { id: 's10', name: '流砂の地',       x: 0.830, y: 0.420 },
      { id: 's11', name: '遺跡の神殿',     x: 0.860, y: 0.200 },
      { id: 's12', name: '海の洞窟へ',     x: 0.420, y: 0.860 }
    ]
  },
  {
    id: 'g2-06', grade: 2, month: 6,
    title: '海の洞窟', sub: '光と影の迷宮',
    img: 'maps/g2-06-sea-cave.webp',
    spots: [
      { id: 's1',  name: 'サンゴのアーチ', x: 0.150, y: 0.430 },
      { id: 's2',  name: 'クジラの骨',     x: 0.270, y: 0.200 },
      { id: 's3',  name: '海の天窓',       x: 0.470, y: 0.100 },
      { id: 's4',  name: '海底の泉',       x: 0.470, y: 0.420 },
      { id: 's5',  name: '結晶の洞窟',     x: 0.850, y: 0.170 },
      { id: 's6',  name: '水中トンネル',   x: 0.840, y: 0.470 },
      { id: 's7',  name: '沈んだ神殿',     x: 0.500, y: 0.730 },
      { id: 's8',  name: '深海の広間',     x: 0.120, y: 0.830 },
      { id: 's9',  name: '宝の洞窟',       x: 0.860, y: 0.800 }
    ]
  }
];

/* ---------- 定数 ---------- */
var STATS = [
  { id: 'think', name: '思考力' },
  { id: 'calc',  name: '計算力' },
  { id: 'read',  name: '読解力' },
  { id: 'write', name: '記述力' },
  { id: 'find',  name: '調べる力' }
];

function stepCost(grade) { return grade <= 3 ? 20 : 20 + (grade - 3) * 6; }
function spotCount(grade) { return grade <= 3 ? 12 : 9; }

/* ---------- 状態 ---------- */
var S = Store.get('dq.state', null) || {
  mapId: 'g2-04',
  reached: 1,
  pts: 0,
  exp: { think: 0, calc: 0, read: 0, write: 0, find: 0 },
  daily: {}
};
function save() { Store.set('dq.state', S); }

function curMap() {
  for (var i = 0; i < MAPS.length; i++) if (MAPS[i].id === S.mapId) return MAPS[i];
  return MAPS[0];
}
function curSpots() {
  var m = curMap();
  return m.spots.slice(0, spotCount(m.grade));
}

function levelOf(id) { return Math.floor((S.exp[id] || 0) / 20); }
function totalLevel() {
  var n = 0; for (var i = 0; i < STATS.length; i++) n += levelOf(STATS[i].id); return n;
}

/* ---------- ビューポート ---------- */
var VIEW = { scale: 1, x: 0, y: 0, base: 1, w: 0, h: 0 };

function fitStage() {
  var img = document.getElementById('mapImg');
  if (!img.naturalWidth) return;
  var stage = document.getElementById('stage');
  var sw = stage.clientWidth, sh = stage.clientHeight;
  VIEW.w = sw;
  VIEW.h = sw * img.naturalHeight / img.naturalWidth;
  document.getElementById('world').style.width = VIEW.w + 'px';
  VIEW.base = Math.max(1, sh / VIEW.h);
  resetView();
}

function resetView() {
  var stage = document.getElementById('stage');
  VIEW.scale = VIEW.base;
  VIEW.x = (stage.clientWidth - VIEW.w * VIEW.scale) / 2;
  VIEW.y = (stage.clientHeight - VIEW.h * VIEW.scale) / 2;
  applyView();
}

function clampView() {
  var stage = document.getElementById('stage');
  var w = VIEW.w * VIEW.scale, h = VIEW.h * VIEW.scale;
  var sw = stage.clientWidth, sh = stage.clientHeight;
  VIEW.x = w <= sw ? (sw - w) / 2 : Math.min(0, Math.max(sw - w, VIEW.x));
  VIEW.y = h <= sh ? (sh - h) / 2 : Math.min(0, Math.max(sh - h, VIEW.y));
}

function applyView() {
  clampView();
  document.getElementById('world').style.transform =
    'translate(' + VIEW.x + 'px,' + VIEW.y + 'px) scale(' + VIEW.scale + ')';
}

function zoomAt(factor, cx, cy) {
  var stage = document.getElementById('stage');
  var r = stage.getBoundingClientRect();
  var px = (cx - r.left - VIEW.x) / VIEW.scale;
  var py = (cy - r.top - VIEW.y) / VIEW.scale;
  var ns = Math.min(6, Math.max(VIEW.base, VIEW.scale * factor));
  VIEW.x -= px * (ns - VIEW.scale);
  VIEW.y -= py * (ns - VIEW.scale);
  VIEW.scale = ns;
  applyView();
}

/* ---------- オーバーレイ ---------- */
function drawOverlay() {
  if (!VIEW.w) return;
  var spots = curSpots();
  var H = Math.round(1000 * VIEW.h / VIEW.w);
  var sv = document.getElementById('overlay');
  sv.setAttribute('viewBox', '0 0 1000 ' + H);

  function X(s) { return (s.x * 1000).toFixed(1); }
  function Y(s) { return (s.y * H).toFixed(1); }

  var s = '';

  s += '<defs>';
  s += '<radialGradient id="clear"><stop offset="0%" stop-color="#000"/>' +
       '<stop offset="55%" stop-color="#000" stop-opacity="0.92"/>' +
       '<stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>';
  s += '<radialGradient id="dim"><stop offset="0%" stop-color="#000" stop-opacity="0.75"/>' +
       '<stop offset="60%" stop-color="#000" stop-opacity="0.4"/>' +
       '<stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>';
  s += '<mask id="fogmask">';
  s += '<rect x="0" y="0" width="1000" height="' + H + '" fill="#fff"/>';
  for (var i = 0; i < S.reached && i < spots.length; i++) {
    var age = (S.reached - 1) - i;
    var rr = (H * (age === 0 ? 0.42 : age <= 2 ? 0.34 : 0.26)).toFixed(0);
    s += '<circle cx="' + X(spots[i]) + '" cy="' + Y(spots[i]) + '" r="' + rr +
         '" fill="url(#clear)"/>';
  }
  if (S.reached < spots.length) {
    var nx = spots[S.reached];
    s += '<circle cx="' + X(nx) + '" cy="' + Y(nx) + '" r="' + (H * 0.30).toFixed(0) +
         '" fill="url(#dim)"/>';
  }
  s += '</mask></defs>';
  s += '<rect x="0" y="0" width="1000" height="' + H + '" fill="#050A14" opacity="0.9" mask="url(#fogmask)"/>';

  var d = '';
  for (var j = 0; j < spots.length; j++) d += (j ? ' L' : 'M') + X(spots[j]) + ' ' + Y(spots[j]);
  s += '<path d="' + d + '" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.26" ' +
       'stroke-dasharray="10 10" stroke-linecap="round" stroke-linejoin="round"/>';

  if (S.reached > 1) {
    var dd = '';
    for (var k = 0; k < S.reached && k < spots.length; k++) dd += (k ? ' L' : 'M') + X(spots[k]) + ' ' + Y(spots[k]);
    s += '<path d="' + dd + '" fill="none" stroke="#FFD98A" stroke-width="5" opacity="0.95" ' +
         'stroke-linecap="round" stroke-linejoin="round"/>';
  }

  for (var n = 0; n < spots.length; n++) {
    var sp = spots[n], cx = X(sp), cy = Y(sp);
    var passed = n < S.reached - 1, here = n === S.reached - 1;
    if (here) {
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="20" fill="none" stroke="#FFD98A" stroke-width="4">' +
           '<animate attributeName="r" values="17;27;17" dur="2.2s" repeatCount="indefinite"/>' +
           '<animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>' +
           '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="#FFD98A" stroke="#7A4E00" stroke-width="2.5"/>';
    } else if (passed) {
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="#9ED75A" stroke="#1F3C06" stroke-width="2"/>';
    } else {
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="#C9C6BC" stroke="#3A3A38" stroke-width="1.5" opacity="0.8"/>';
    }
    if (passed || here) {
      var lab = sp.name, w = lab.length * 15 + 16;
      s += '<rect x="' + (cx - w / 2) + '" y="' + (+cy + 17) + '" width="' + w + '" height="26" rx="6" ' +
           'fill="#141414" opacity="0.6"/>' +
           '<text x="' + cx + '" y="' + (+cy + 35) + '" text-anchor="middle" font-size="16" fill="#FFF8E8">' +
           lab + '</text>';
    }
  }

  for (var p = 0; p < PICK.length; p++) {
    var px = (PICK[p].x * 1000).toFixed(1), py = (PICK[p].y * H).toFixed(1);
    s += '<circle cx="' + px + '" cy="' + py + '" r="8" fill="none" stroke="#FF4D4D" stroke-width="3"/>' +
         '<text x="' + (+px + 13) + '" y="' + (+py + 5) + '" font-size="15" fill="#FF4D4D">' + (p + 1) + '</text>';
  }

  sv.innerHTML = s;
}

/* ---------- 画面更新 ---------- */
function drawHeader() {
  var m = curMap(), spots = curSpots();
  document.getElementById('mapTitle').textContent = m.title;
  document.getElementById('totalLv').textContent = 'Lv.' + totalLevel();
  document.getElementById('progress').textContent = m.sub + '　' + S.reached + ' / ' + spots.length;
  var here = spots[Math.min(S.reached, spots.length) - 1];
  document.getElementById('spotTitle').textContent = here ? here.name : '—';
  var need = stepCost(m.grade);
  document.getElementById('spotNote').textContent =
    S.reached >= spots.length
      ? 'この マップは クリア！ つぎの 地図が まっています。'
      : 'つぎの スポットまで あと ' + Math.max(0, need - S.pts) + ' ポイント';
}

function drawStats() {
  var s = '';
  for (var i = 0; i < STATS.length; i++) {
    var st = STATS[i], lv = levelOf(st.id), pct = ((S.exp[st.id] || 0) % 20) / 20 * 100;
    s += '<div class="rowline"><span class="nm">' + st.name + '</span>' +
         '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
         '<span class="vl">Lv.' + lv + '</span></div>';
  }
  document.getElementById('stats').innerHTML = s;
}

function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

var QUESTS = [
  { id: 'q1', name: 'おんどく',               xp: 8,  pt: 3, stat: 'read'  },
  { id: 'q2', name: 'けいさんドリル',         xp: 12, pt: 4, stat: 'calc'  },
  { id: 'q3', name: 'かん字',                 xp: 8,  pt: 3, stat: 'write' },
  { id: 'q4', name: 'たんけん（じゆうけんきゅう）', xp: 10, pt: 4, stat: 'find', explore: true }
];

function drawQuests() {
  var done = S.daily[todayKey()] || [], s = '';
  for (var i = 0; i < QUESTS.length; i++) {
    var q = QUESTS[i], on = done.indexOf(q.id) >= 0;
    s += '<div class="quest' + (on ? ' done' : '') + (q.explore ? ' explore' : '') +
         '" data-q="' + q.id + '"><span class="tg"></span><span class="tx">' + q.name +
         '</span><span class="xp">+' + q.pt + 'pt</span></div>';
  }
  document.getElementById('quests').innerHTML = s;
}

function redraw() { drawHeader(); drawStats(); drawQuests(); drawOverlay(); }

/* ---------- クエスト ---------- */
function toggleQuest(id) {
  var key = todayKey();
  if (!S.daily[key]) S.daily[key] = [];
  var list = S.daily[key], at = list.indexOf(id), q = null;
  for (var i = 0; i < QUESTS.length; i++) if (QUESTS[i].id === id) q = QUESTS[i];
  if (!q) return;

  if (at >= 0) {
    list.splice(at, 1);
    S.pts = Math.max(0, S.pts - q.pt);
    S.exp[q.stat] = Math.max(0, (S.exp[q.stat] || 0) - q.xp);
  } else {
    list.push(id);
    S.pts += q.pt;
    S.exp[q.stat] = (S.exp[q.stat] || 0) + q.xp;
    var need = stepCost(curMap().grade);
    while (S.pts >= need && S.reached < curSpots().length) {
      S.pts -= need;
      S.reached++;
      toast('「' + curSpots()[S.reached - 1].name + '」に つきました！');
    }
  }
  save(); redraw();
}

/* ---------- トースト ---------- */
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2300);
}

/* ---------- 座標ピッカー ---------- */
var PICK = [], pickMode = false;

function pickRender() {
  document.getElementById('pickOut').value = PICK.map(function (p, i) {
    return "{ id: 's" + (i + 1) + "', name: '', x: " + p.x.toFixed(3) + ", y: " + p.y.toFixed(3) + " },";
  }).join('\n');
  document.getElementById('pickCount').textContent = PICK.length + '点';
  drawOverlay();
}

function togglePicker() {
  pickMode = !pickMode;
  document.getElementById('picker').classList.toggle('on', pickMode);
  toast(pickMode ? '座標ピッカー ON：地図をタップ' : '座標ピッカー OFF');
}

document.getElementById('mapTitle').addEventListener('click', (function () {
  var n = 0, last = 0;
  return function () {
    var now = Date.now();
    n = (now - last < 700) ? n + 1 : 1;
    last = now;
    if (n >= 5) { n = 0; togglePicker(); }
  };
})());

document.getElementById('pickUndo').addEventListener('click', function () { PICK.pop(); pickRender(); });
document.getElementById('pickClear').addEventListener('click', function () { PICK = []; pickRender(); });
document.getElementById('pickClose').addEventListener('click', togglePicker);
document.getElementById('pickCopy').addEventListener('click', function () {
  var ta = document.getElementById('pickOut');
  ta.removeAttribute('readonly');
  ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.setAttribute('readonly', 'readonly');
  toast(ok ? 'コピーしました' : '長押しでコピーしてください');
});

/* ---------- ジェスチャ ---------- */
(function () {
  var stage = document.getElementById('stage');
  var pts = {}, startDist = 0, startScale = 1, startMid = null, startX = 0, startY = 0;
  var panning = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false, lastTap = 0;

  function ids() { return Object.keys(pts); }
  function dist() {
    var k = ids(); if (k.length < 2) return 0;
    return Math.hypot(pts[k[0]].x - pts[k[1]].x, pts[k[0]].y - pts[k[1]].y);
  }
  function mid() {
    var k = ids(); if (k.length < 2) return null;
    return { x: (pts[k[0]].x + pts[k[1]].x) / 2, y: (pts[k[0]].y + pts[k[1]].y) / 2 };
  }

  stage.addEventListener('pointerdown', function (e) {
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids().length === 1) {
      panning = true; moved = false;
      sx = e.clientX; sy = e.clientY; ox = VIEW.x; oy = VIEW.y;
    } else if (ids().length === 2) {
      panning = false;
      startDist = dist(); startScale = VIEW.scale; startMid = mid();
      startX = VIEW.x; startY = VIEW.y;
    }
  });

  stage.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids().length >= 2 && startDist) {
      var f = dist() / startDist, m = mid() || startMid;
      var r = stage.getBoundingClientRect();
      var px = (startMid.x - r.left - startX) / startScale;
      var py = (startMid.y - r.top - startY) / startScale;
      VIEW.scale = Math.min(6, Math.max(VIEW.base, startScale * f));
      VIEW.x = m.x - r.left - px * VIEW.scale;
      VIEW.y = m.y - r.top - py * VIEW.scale;
      applyView();
    } else if (panning) {
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
      VIEW.x = ox + dx; VIEW.y = oy + dy;
      applyView();
    }
  });

  function up(e) {
    if (!pts[e.pointerId]) return;
    var wasSingle = ids().length === 1;
    delete pts[e.pointerId];
    if (ids().length < 2) startDist = 0;
    if (ids().length === 1) {
      var k = ids()[0];
      panning = true; moved = true;
      sx = pts[k].x; sy = pts[k].y; ox = VIEW.x; oy = VIEW.y;
    }
    if (wasSingle && !moved) {
      var r = stage.getBoundingClientRect();
      var rx = (e.clientX - r.left - VIEW.x) / VIEW.scale / VIEW.w;
      var ry = (e.clientY - r.top - VIEW.y) / VIEW.scale / VIEW.h;
      if (pickMode) {
        if (rx >= 0 && rx <= 1 && ry >= 0 && ry <= 1) { PICK.push({ x: rx, y: ry }); pickRender(); }
      } else {
        var now = Date.now();
        if (now - lastTap < 320) zoomAt(1.9, e.clientX, e.clientY);
        lastTap = now;
      }
    }
    if (ids().length === 0) panning = false;
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY);
  }, { passive: false });
})();

document.getElementById('zoomIn').addEventListener('click', function () {
  var r = document.getElementById('stage').getBoundingClientRect();
  zoomAt(1.5, r.left + r.width / 2, r.top + r.height / 2);
});
document.getElementById('zoomOut').addEventListener('click', function () {
  var r = document.getElementById('stage').getBoundingClientRect();
  zoomAt(0.67, r.left + r.width / 2, r.top + r.height / 2);
});
document.getElementById('reset').addEventListener('click', resetView);

document.getElementById('quests').addEventListener('click', function (e) {
  var r = e.target.closest('.quest'); if (!r) return;
  toggleQuest(r.getAttribute('data-q'));
});

/* ---------- 起動 ---------- */
function loadMap(id) {
  S.mapId = id; save();
  var m = curMap();
  var img = document.getElementById('mapImg');
  img.onload = function () { fitStage(); redraw(); };
  img.onerror = function () { toast('画像が よみこめません: ' + m.img); };
  img.src = m.img;
}

window.addEventListener('resize', function () { fitStage(); drawOverlay(); });
loadMap(S.mapId);
redraw();
</script>
</body>
